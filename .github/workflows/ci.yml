name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Threshold reflects actual coverage today (Application ~62%, Domain ~93%);
      # raise it as coverage improves.
      - name: Run unit tests with coverage
        run: |
          dotnet test --configuration Release \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover \
          /p:Threshold=60 \
          /p:ThresholdType=line \
          '/p:Include="[Bloom.Application]*,[Bloom.Domain]*"'

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/bloom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/bloom/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  migration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bloom_ci
          POSTGRES_PASSWORD: bloom_ci_pass
          POSTGRES_DB: bloom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore

      - name: Run migrations
        run: dotnet ef database update --project src/Bloom.Infrastructure --startup-project src/Bloom.Main
        env:
          Database__Provider: PostgreSQL
          Database__ConnectionString: "Host=localhost;Port=5432;Database=bloom_test;Username=bloom_ci;Password=bloom_ci_pass"
          Database__Username: bloom_ci
          Database__Password: bloom_ci_pass
          Jwt__Issuer: bloom
          Jwt__Audience: bloom-client
          Jwt__Key: "ci-only-key-not-used-in-prod-must-be-32chars!"
          Jwt__ExpiryMinutes: "60"
