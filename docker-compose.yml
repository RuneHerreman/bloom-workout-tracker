
services:
  bloom-api:
    build: .
    ports:
      - 8080:5000
    env_file:
      - .env
    depends_on:
      - postgres
        
  postgres:
    image: postgres:16
    container_name: bloom-db
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: