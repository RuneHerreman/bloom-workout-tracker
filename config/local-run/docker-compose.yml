services:
  bloom-api:
    build: ../../
    ports:
      - "8080:5000"
    env_file:
      - .local.env
    depends_on:
      bloom-db:
        condition: service_healthy
    networks:
      - bloom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  bloom-db:
    image: postgres:16
    env_file:
      - .local.env
    # Port 5432 is intentionally not exposed to the host — only the API container
    # needs direct DB access and it communicates over the internal bridge network.
    volumes:
      - local-run-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bloom-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api/
    ports:
      - "3000:80"
    depends_on:
      bloom-api:
        condition: service_healthy
    networks:
      - bloom-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

volumes:
  local-run-postgres-data:

networks:
  bloom-network:
    driver: bridge
