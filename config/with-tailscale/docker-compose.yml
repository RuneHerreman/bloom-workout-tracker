services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-gateway
    hostname: bloom-app
    restart: unless-stopped
    env_file:
      - ./.tailscale.env
    environment:
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve-config.json
    volumes:
      - tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts-serve-config.json:/config/ts-serve-config.json:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - bloom-network

  bloom-api:
    build:
      context: ../../
    network_mode: "service:tailscale"
    restart: unless-stopped
    env_file:
      - ./.tailscale.env
    environment:
      - DataProtection__KeysPath=/keys
    volumes:
      - tailscale-dataprotection-keys:/keys
    depends_on:
      bloom-db:
        condition: service_healthy
      tailscale:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  bloom-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.tailscale.env
    volumes:
      - tailscale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bloom-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api/
    network_mode: "service:tailscale"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bloom-api:
        condition: service_healthy
      tailscale:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

volumes:
  tailscale-postgres-data:
  tailscale-data:
  tailscale-dataprotection-keys:

networks:
  bloom-network:
    driver: bridge